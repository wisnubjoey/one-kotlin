<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Menu & History</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8fafc;
            padding: 24px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 520px;
        }

        .card-btn {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 160px;
            padding: 20px;
            border: 2px solid transparent;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            text-align: left;
            color: #ffffff;
            background-color: #18181b;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card-btn:hover {
            transform: translateY(-3px);
            border-color: #14532D;
        }

        .card-btn:active {
            transform: scale(0.98);
        }

        .card-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.45;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .card-btn:hover .card-bg {
            transform: scale(1.05);
            opacity: 0.55;
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(9, 9, 11, 0.9) 15%, rgba(9, 9, 11, 0.2) 100%);
        }

        .card-info {
            position: relative;
            z-index: 2;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 4px;
        }

        .card-sub {
            font-size: 13px;
            color: #d4d4d8;
        }

        @media (max-width: 480px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="settings-grid">
        <!-- Card 1: Menu -->
        <button type="button" class="card-btn" onclick="console.log('Buka Settings Menu')">
            <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=600&q=80"
                alt="Menu Settings" class="card-bg">
            <div class="card-overlay"></div>
            <div class="card-info">
                <div class="card-title">Menu</div>
                <div class="card-sub">Atur item, kategori & harga</div>
            </div>
        </button>

        <!-- Card 2: History -->
        <button type="button" class="card-btn" onclick="console.log('Buka Settings History')">
            <img src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=600&q=80"
                alt="History Settings" class="card-bg">
            <div class="card-overlay"></div>
            <div class="card-info">
                <div class="card-title">History</div>
                <div class="card-sub">Riwayat transaksi & log</div>
            </div>
        </button>
    </div>

</body>

</html>
