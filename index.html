<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Café POS — Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: {
                            DEFAULT: '#064e3b',
                            hover: '#053a2c',
                            soft: '#ecfdf5',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html,
        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
        }

        /* Hide scrollbars but keep scrolling */
        .no-scrollbar::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Subtle border tokens */
        .border-hairline {
            border-color: #e5e5e5;
        }

        .border-hairline-strong {
            border-color: #d4d4d4;
        }

        /* Touch feedback */
        button,
        .tap {
            -webkit-user-select: none;
            user-select: none;
        }

        .tap:active {
            transform: scale(0.98);
            transition: transform 80ms ease;
        }

        /* Smooth fade-in for cart line */
        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pop {
            animation: pop 140ms ease-out;
        }
    </style>
</head>

<body class="h-full bg-white text-neutral-900 antialiased">
    <div class="flex h-full w-full">

        <!-- ============ LEFT SIDEBAR ============ -->
        <aside
            class="w-[88px] shrink-0 border-r border-hairline bg-white flex flex-col items-center justify-between py-5">
            <!-- Logo -->
            <div class="flex flex-col items-center gap-6">
                <div class="h-10 w-10 rounded-xl bg-neutral-900 flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 8h1a4 4 0 1 1 0 8h-1" />
                        <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z" />
                        <line x1="6" y1="2" x2="6" y2="4" />
                        <line x1="10" y1="2" x2="10" y2="4" />
                        <line x1="14" y1="2" x2="14" y2="4" />
                    </svg>
                </div>

                <!-- Primary nav -->
                <nav class="flex flex-col items-center gap-2">
                    <button data-nav="menu"
                        class="nav-btn group w-14 h-14 rounded-xl flex flex-col items-center justify-center gap-1 bg-neutral-900 text-white tap">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16v16H4z" />
                            <path d="M4 9h16M9 4v16" />
                        </svg>
                        <span class="text-[10px] font-semibold">Menu</span>
                    </button>
                    <button data-nav="transactions"
                        class="nav-btn group w-14 h-14 rounded-xl flex flex-col items-center justify-center gap-1 text-neutral-500 hover:bg-neutral-100 tap">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M7 10h10M7 14h6" />
                            <rect x="3" y="4" width="18" height="16" rx="2" />
                        </svg>
                        <span class="text-[10px] font-semibold">Sales</span>
                    </button>
                    <button data-nav="settings"
                        class="nav-btn group w-14 h-14 rounded-xl flex flex-col items-center justify-center gap-1 text-neutral-500 hover:bg-neutral-100 tap">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3" />
                            <path
                                d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" />
                        </svg>
                        <span class="text-[10px] font-semibold">Settings</span>
                    </button>
                </nav>
            </div>

            <!-- Bottom: barista -->
            <div class="flex flex-col items-center gap-3">
                <button
                    class="w-12 h-12 rounded-full bg-neutral-200 flex items-center justify-center text-neutral-700 text-sm font-semibold tap hover:bg-neutral-300 transition">
                    AR
                </button>
                <span class="text-[9px] text-neutral-400 font-medium tracking-wide">v1.0</span>
            </div>
        </aside>

        <!-- ============ CENTRAL AREA ============ -->
        <main class="flex-1 min-w-0 flex flex-col bg-neutral-50">

            <!-- Top bar -->
            <header class="h-[72px] bg-white border-b border-hairline px-8 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <h1 class="text-2xl font-bold tracking-tight text-neutral-900">Order</h1>
                    <span
                        class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-accent-soft text-accent text-xs font-semibold">
                        <span class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></span>
                        Dine-in · Table 07
                    </span>
                </div>
                <div class="flex items-center gap-4">
                    <!-- Search -->
                    <div class="relative">
                        <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.3-4.3" />
                        </svg>
                        <input type="text" placeholder="Search menu…"
                            class="w-56 h-10 pl-9 pr-3 rounded-lg bg-neutral-100 text-sm placeholder:text-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-900/10 focus:bg-white focus:border-neutral-300 border border-transparent transition" />
                    </div>
                    <button
                        class="h-10 px-3.5 rounded-lg border border-hairline-strong bg-white text-sm font-medium text-neutral-700 hover:bg-neutral-50 tap flex items-center gap-2">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                        Today
                    </button>
                </div>
            </header>

            <!-- Category filter -->
            <div class="bg-white border-b border-hairline px-8">
                <div class="flex items-center gap-1 overflow-x-auto no-scrollbar py-3">
                    <button data-cat="all"
                        class="cat-btn px-4 h-9 rounded-full text-sm font-semibold whitespace-nowrap bg-neutral-900 text-white tap">All</button>
                    <button data-cat="espresso"
                        class="cat-btn px-4 h-9 rounded-full text-sm font-semibold whitespace-nowrap text-neutral-600 hover:bg-neutral-100 tap">Espresso</button>
                    <button data-cat="manual"
                        class="cat-btn px-4 h-9 rounded-full text-sm font-semibold whitespace-nowrap text-neutral-600 hover:bg-neutral-100 tap">Manual
                        Brew</button>
                    <button data-cat="noncoffee"
                        class="cat-btn px-4 h-9 rounded-full text-sm font-semibold whitespace-nowrap text-neutral-600 hover:bg-neutral-100 tap">Non-Coffee</button>
                    <button data-cat="tea"
                        class="cat-btn px-4 h-9 rounded-full text-sm font-semibold whitespace-nowrap text-neutral-600 hover:bg-neutral-100 tap">Tea</button>
                    <button data-cat="cold"
                        class="cat-btn px-4 h-9 rounded-full text-sm font-semibold whitespace-nowrap text-neutral-600 hover:bg-neutral-100 tap">Cold
                        Brew</button>
                    <button data-cat="food"
                        class="cat-btn px-4 h-9 rounded-full text-sm font-semibold whitespace-nowrap text-neutral-600 hover:bg-neutral-100 tap">Pastries</button>
                </div>
            </div>

            <!-- Product grid -->
            <div class="flex-1 overflow-y-auto px-8 py-6">
                <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
                <p id="empty-state" class="hidden text-center text-neutral-400 text-sm py-16">No items in this category.
                </p>
            </div>
        </main>

        <!-- ============ RIGHT ORDER PANEL ============ -->
        <aside class="w-[350px] shrink-0 border-l border-hairline bg-white flex flex-col">

            <!-- Order header -->
            <div class="px-5 py-4 border-b border-hairline flex items-center justify-between">
                <div>
                    <h2 class="text-base font-bold text-neutral-900">Current Order</h2>
                    <p class="text-xs text-neutral-400 mt-0.5"><span id="order-id">#A-1042</span> · <span
                            id="item-count">0 items</span></p>
                </div>
                <button id="clear-order"
                    class="text-xs font-medium text-neutral-400 hover:text-neutral-700 tap px-2 py-1 rounded">Clear</button>
            </div>

            <!-- Order type toggle -->
            <div class="px-5 py-3 border-b border-hairline">
                <div class="grid grid-cols-2 gap-1 p-1 bg-neutral-100 rounded-lg">
                    <button data-otype="dinein"
                        class="otype-btn h-8 rounded-md text-xs font-semibold bg-white text-neutral-900 shadow-sm tap">Dine-in</button>
                    <button data-otype="takeout"
                        class="otype-btn h-8 rounded-md text-xs font-semibold text-neutral-500 tap">Takeout</button>
                </div>
            </div>

            <!-- Order lines -->
            <div id="cart" class="flex-1 overflow-y-auto px-5 py-3 space-y-3">
                <!-- Empty placeholder -->
                <div id="cart-empty" class="h-full flex flex-col items-center justify-center text-center gap-3 py-10">
                    <div class="w-12 h-12 rounded-full bg-neutral-100 flex items-center justify-center">
                        <svg class="w-5 h-5 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                            <path d="M3 6h18" />
                            <path d="M16 10a4 4 0 0 1-8 0" />
                        </svg>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-neutral-500">No items yet</p>
                        <p class="text-xs text-neutral-400 mt-0.5">Tap a product to add it</p>
                    </div>
                </div>
            </div>

            <!-- Totals -->
            <div class="border-t border-hairline px-5 py-4 space-y-2.5">
                <div class="flex justify-between text-sm">
                    <span class="text-neutral-500">Subtotal</span>
                    <span id="subtotal" class="font-medium text-neutral-900">$0.00</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-neutral-500">Tax (8%)</span>
                    <span id="tax" class="font-medium text-neutral-900">$0.00</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-neutral-500">Discount</span>
                    <span id="discount" class="font-medium text-neutral-400">—</span>
                </div>
                <div class="border-t border-hairline pt-2.5 flex justify-between items-baseline">
                    <span class="text-sm font-semibold text-neutral-900">Total</span>
                    <span id="total" class="text-2xl font-bold text-neutral-900">$0.00</span>
                </div>
            </div>

            <!-- Pay button -->
            <div class="p-5 pt-0">
                <button id="pay-btn"
                    class="w-full h-14 rounded-xl bg-accent hover:bg-accent-hover text-white font-semibold text-base tap flex items-center justify-center gap-2 transition disabled:opacity-40 disabled:cursor-not-allowed"
                    disabled>
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="5" width="20" height="14" rx="2" />
                        <line x1="2" y1="10" x2="22" y2="10" />
                    </svg>
                    Pay Now
                </button>
                <p class="text-center text-[11px] text-neutral-400 mt-2">Press to charge customer</p>
            </div>
        </aside>
    </div>

    <!-- ============ MODIFIER DRAWER (hidden by default) ============ -->
    <div id="modifier-overlay" class="fixed inset-0 bg-black/40 z-40 hidden">
        <div id="modifier-panel"
            class="absolute right-0 top-0 h-full w-[380px] bg-white shadow-2xl flex flex-col translate-x-full transition-transform duration-200">
            <div class="px-6 py-5 border-b border-hairline flex items-center justify-between">
                <div>
                    <h3 id="mod-product-name" class="text-lg font-bold">Product</h3>
                    <p class="text-xs text-neutral-400 mt-0.5">Customize this item</p>
                </div>
                <button id="mod-close"
                    class="w-9 h-9 rounded-lg hover:bg-neutral-100 tap flex items-center justify-center">
                    <svg class="w-5 h-5 text-neutral-500" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div id="mod-body" class="flex-1 overflow-y-auto px-6 py-5 space-y-6"></div>
            <div class="px-6 py-4 border-t border-hairline">
                <button id="mod-add"
                    class="w-full h-12 rounded-xl bg-neutral-900 hover:bg-neutral-800 text-white font-semibold text-sm tap">Add
                    to Order</button>
            </div>
        </div>
    </div>

    <script>
        // ---- Product catalog ----
        const PRODUCTS = [
            { id: 1, name: 'Espresso', price: 3.00, cat: 'espresso', abbr: 'ESP' },
            { id: 2, name: 'Americano', price: 3.75, cat: 'espresso', abbr: 'AME' },
            { id: 3, name: 'Cappuccino', price: 4.25, cat: 'espresso', abbr: 'CAP' },
            { id: 4, name: 'Flat White', price: 4.50, cat: 'espresso', abbr: 'FW' },
            { id: 5, name: 'Latte', price: 4.75, cat: 'espresso', abbr: 'LAT' },
            { id: 6, name: 'Mocha', price: 5.25, cat: 'espresso', abbr: 'MOC' },
            { id: 7, name: 'Cortado', price: 4.00, cat: 'espresso', abbr: 'COR' },
            { id: 8, name: 'Macchiato', price: 4.00, cat: 'espresso', abbr: 'MAC' },
            { id: 9, name: 'Pour Over', price: 5.00, cat: 'manual', abbr: 'POV' },
            { id: 10, name: 'V60', price: 5.50, cat: 'manual', abbr: 'V60' },
            { id: 11, name: 'Chemex', price: 6.50, cat: 'manual', abbr: 'CHX' },
            { id: 12, name: 'Aeropress', price: 5.25, cat: 'manual', abbr: 'AER' },
            { id: 13, name: 'Hot Chocolate', price: 4.50, cat: 'noncoffee', abbr: 'HC' },
            { id: 14, name: 'Matcha Latte', price: 5.50, cat: 'noncoffee', abbr: 'MTL' },
            { id: 15, name: 'Chai Latte', price: 5.00, cat: 'noncoffee', abbr: 'CHL' },
            { id: 16, name: 'Lemonade', price: 4.00, cat: 'noncoffee', abbr: 'LMN' },
            { id: 17, name: 'Green Tea', price: 3.50, cat: 'tea', abbr: 'GT' },
            { id: 18, name: 'Earl Grey', price: 3.50, cat: 'tea', abbr: 'EG' },
            { id: 19, name: 'Jasmine', price: 3.75, cat: 'tea', abbr: 'JAS' },
            { id: 20, name: 'Cold Brew', price: 4.50, cat: 'cold', abbr: 'CB' },
            { id: 21, name: 'Nitro Cold Brew', price: 5.50, cat: 'cold', abbr: 'NCB' },
            { id: 22, name: 'Iced Latte', price: 5.00, cat: 'cold', abbr: 'IL' },
            { id: 23, name: 'Croissant', price: 3.50, cat: 'food', abbr: 'CR' },
            { id: 24, name: 'Pain au Chocolat', price: 4.00, cat: 'food', abbr: 'PDC' },
            { id: 25, name: 'Blueberry Muffin', price: 3.75, cat: 'food', abbr: 'BM' },
            { id: 26, name: 'Cinnamon Roll', price: 4.50, cat: 'food', abbr: 'CR' },
            { id: 27, name: 'Banana Bread', price: 3.50, cat: 'food', abbr: 'BB' },
        ];

        // Modifier groups
        const MOD_GROUPS = [
            { key: 'size', label: 'Size', options: [{ l: 'Small', v: 0 }, { l: 'Regular', v: 0, def: true }, { l: 'Large', v: 0.75 }] },
            { key: 'milk', label: 'Milk', options: [{ l: 'Whole', v: 0, def: true }, { l: 'Oat', v: 0.5 }, { l: 'Almond', v: 0.5 }, { l: 'Skim', v: 0 }] },
            { key: 'shot', label: 'Extra Shot', options: [{ l: 'None', v: 0, def: true }, { l: 'Single +', v: 0.75 }, { l: 'Double +', v: 1.50 }] },
        ];

        const SUGAR = ['None', '1', '2', '3'];

        // ---- State ----
        let cart = [];
        let activeCat = 'all';
        let activeProduct = null;
        let selectedMods = {};

        const TAX_RATE = 0.08;
        const $ = sel => document.querySelector(sel);
        const $$ = sel => document.querySelectorAll(sel);

        const fmt = n => '$' + n.toFixed(2);

        // ---- Render product grid ----
        function renderProducts() {
            const grid = $('#product-grid');
            const list = activeCat === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.cat === activeCat);
            if (list.length === 0) {
                grid.innerHTML = '';
                $('#empty-state').classList.remove('hidden');
                return;
            }
            $('#empty-state').classList.add('hidden');
            grid.innerHTML = list.map(p => `
        <button data-id="${p.id}" class="product-card group h-[140px] p-4 rounded-xl bg-white border border-hairline hover:border-neutral-900 hover:bg-neutral-50 tap flex flex-col justify-between text-left transition">
          <div class="flex items-start justify-between">
            <div class="h-9 w-9 rounded-lg bg-neutral-100 flex items-center justify-center">
              <span class="text-[10px] font-bold text-neutral-500 tracking-wide">${p.abbr}</span>
            </div>
            <span class="text-sm font-bold text-neutral-900">${fmt(p.price)}</span>
          </div>
          <div>
            <p class="text-sm font-semibold text-neutral-900 leading-tight">${p.name}</p>
            <p class="text-xs text-neutral-400 mt-0.5 capitalize">${p.cat}</p>
          </div>
        </button>
      `).join('');

            $$('.product-card').forEach(card => {
                card.addEventListener('click', () => openModifier(parseInt(card.dataset.id)));
            });
        }

        // ---- Category filter ----
        $$('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                activeCat = btn.dataset.cat;
                $$('.cat-btn').forEach(b => b.className = 'cat-btn px-4 h-9 rounded-full text-sm font-semibold whitespace-nowrap text-neutral-600 hover:bg-neutral-100 tap');
                btn.className = 'cat-btn px-4 h-9 rounded-full text-sm font-semibold whitespace-nowrap bg-neutral-900 text-white tap';
                renderProducts();
            });
        });

        // ---- Nav buttons ----
        $$('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                $$('.nav-btn').forEach(b => {
                    b.className = 'nav-btn group w-14 h-14 rounded-xl flex flex-col items-center justify-center gap-1 text-neutral-500 hover:bg-neutral-100 tap';
                });
                btn.className = 'nav-btn group w-14 h-14 rounded-xl flex flex-col items-center justify-center gap-1 bg-neutral-900 text-white tap';
            });
        });

        // ---- Order type ----
        $$('.otype-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                $$('.otype-btn').forEach(b => {
                    b.className = 'otype-btn h-8 rounded-md text-xs font-semibold text-neutral-500 tap';
                });
                btn.className = 'otype-btn h-8 rounded-md text-xs font-semibold bg-white text-neutral-900 shadow-sm tap';
            });
        });

        // ---- Modifier drawer ----
        function openModifier(id) {
            const p = PRODUCTS.find(x => x.id === id);
            if (!p) return;
            activeProduct = p;
            selectedMods = { size: 0, milk: 0, shot: 0, sugar: 'None' };
            $('#mod-product-name').textContent = p.name;
            const body = $('#mod-body');

            // Build modifier groups (size/milk/shot as radio)
            let html = MOD_GROUPS.map(g => {
                return `
          <div>
            <p class="text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-2">${g.label}</p>
            <div class="grid grid-cols-${g.options.length <= 2 ? 2 : g.options.length === 3 ? 3 : 4} gap-2">
              ${g.options.map((o, i) => `
                <button data-group="${g.key}" data-idx="${i}" data-val="${o.v}" data-label="${o.l}"
                  class="mod-opt ${o.def ? 'mod-active bg-neutral-900 text-white border-neutral-900' : 'border-hairline-strong text-neutral-700'} h-10 rounded-lg border text-xs font-semibold tap">
                  ${o.l}${o.v > 0 ? ` <span class="opacity-70">+${fmt(o.v)}</span>` : ''}
                </button>
              `).join('')}
            </div>
          </div>
        `;
            }).join('');

            // Sugar as pill options
            html += `
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-2">Sugar</p>
          <div class="flex gap-2 flex-wrap">
            ${SUGAR.map(s => `
              <button data-sugar="${s}" class="sugar-opt ${s === 'None' ? 'sugar-active bg-neutral-900 text-white' : 'border-hairline-strong text-neutral-700'} h-9 px-3 rounded-lg border text-xs font-semibold tap">${s}</button>
            `).join('')}
          </div>
        </div>
      `;

            // Quantity selector
            html += `
        <div class="pt-2 border-t border-hairline">
          <p class="text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-2">Quantity</p>
          <div class="flex items-center justify-center gap-4">
            <button id="qty-minus" class="w-10 h-10 rounded-lg border border-hairline-strong text-neutral-700 text-lg font-semibold tap">−</button>
            <span id="qty-val" class="text-xl font-bold w-8 text-center">1</span>
            <button id="qty-plus" class="w-10 h-10 rounded-lg border border-hairline-strong text-neutral-700 text-lg font-semibold tap">+</button>
          </div>
        </div>
      `;

            body.innerHTML = html;

            // Wire radio modifier groups
            $$('.mod-opt').forEach(btn => {
                btn.addEventListener('click', () => {
                    const g = btn.dataset.group;
                    selectedMods[g] = { v: parseFloat(btn.dataset.val), label: btn.dataset.label };
                    $$(`.mod-opt[data-group="${g}"]`).forEach(b => {
                        b.className = 'mod-opt border-hairline-strong text-neutral-700 h-10 rounded-lg border text-xs font-semibold tap';
                    });
                    btn.className = 'mod-opt mod-active bg-neutral-900 text-white border-neutral-900 h-10 rounded-lg border text-xs font-semibold tap';
                });
            });
            // initialize default selections to {v,label}
            MOD_GROUPS.forEach(g => {
                const def = g.options.find(o => o.def);
                selectedMods[g.key] = { v: def.v, label: def.l };
            });

            // Sugar pills
            $$('.sugar-opt').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectedMods.sugar = btn.dataset.sugar;
                    $$('.sugar-opt').forEach(b => b.className = 'sugar-opt border-hairline-strong text-neutral-700 h-9 px-3 rounded-lg border text-xs font-semibold tap');
                    btn.className = 'sugar-opt sugar-active bg-neutral-900 text-white h-9 px-3 rounded-lg border text-xs font-semibold tap border-neutral-900';
                });
            });

            // Quantity
            let qty = 1;
            $('#qty-minus').addEventListener('click', () => { qty = Math.max(1, qty - 1); $('#qty-val').textContent = qty; });
            $('#qty-plus').addEventListener('click', () => { qty = qty + 1; $('#qty-val').textContent = qty; });
            $('#mod-add').dataset.qty = qty;
            // store qty on close - actually rebind on add
            $('#mod-add').onclick = () => {
                const q = parseInt($('#qty-val').textContent);
                addToCart(activeProduct, { ...selectedMods }, q);
                closeModifier();
            };

            // show panel
            $('#modifier-overlay').classList.remove('hidden');
            requestAnimationFrame(() => {
                $('#modifier-panel').classList.remove('translate-x-full');
            });
        }

        function closeModifier() {
            $('#modifier-panel').classList.add('translate-x-full');
            setTimeout(() => {
                $('#modifier-overlay').classList.add('hidden');
            }, 200);
        }
        $('#mod-close').addEventListener('click', closeModifier);
        $('#modifier-overlay').addEventListener('click', (e) => {
            if (e.target === $('#modifier-overlay')) closeModifier();
        });

        // ---- Cart ----
        function addToCart(product, mods, qty) {
            // Build modifier string for display
            const modLabels = ['size', 'milk', 'shot']
                .filter(k => mods[k] && mods[k].label)
                .map(k => mods[k].label)
                .join(' · ');
            const sugarLabel = mods.sugar && mods.sugar !== 'None' ? `${mods.sugar} sugar` : '';
            const modSummary = [modLabels, sugarLabel].filter(Boolean).join(' · ');

            const modPrice = (mods.size?.v || 0) + (mods.milk?.v || 0) + (mods.shot?.v || 0);
            const unitPrice = product.price + modPrice;

            // Try to merge identical lines
            const existing = cart.find(line => line.productId === product.id && line.mods === modSummary);
            if (existing) {
                existing.qty += qty;
            } else {
                cart.push({
                    id: Date.now() + Math.random(),
                    productId: product.id,
                    name: product.name,
                    unitPrice,
                    basePrice: product.price,
                    mods: modSummary,
                    qty,
                });
            }
            renderCart();
        }

        function changeQty(lineId, delta) {
            const line = cart.find(l => l.id === lineId);
            if (!line) return;
            line.qty += delta;
            if (line.qty <= 0) {
                cart = cart.filter(l => l.id !== lineId);
            }
            renderCart();
        }

        function removeLine(lineId) {
            cart = cart.filter(l => l.id !== lineId);
            renderCart();
        }

        function renderCart() {
            const cartEl = $('#cart');
            if (cart.length === 0) {
                cartEl.innerHTML = `
          <div id="cart-empty" class="h-full flex flex-col items-center justify-center text-center gap-3 py-10">
            <div class="w-12 h-12 rounded-full bg-neutral-100 flex items-center justify-center">
              <svg class="w-5 h-5 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </div>
            <div>
              <p class="text-sm font-medium text-neutral-500">No items yet</p>
              <p class="text-xs text-neutral-400 mt-0.5">Tap a product to add it</p>
            </div>
          </div>
        `;
            } else {
                cartEl.innerHTML = cart.map(line => `
          <div class="pop flex gap-3 items-start py-3 border-b border-hairline last:border-0">
            <div class="flex-1 min-w-0">
              <div class="flex items-start justify-between gap-2">
                <p class="text-sm font-semibold text-neutral-900 leading-tight">${line.name}</p>
                <button data-remove="${line.id}" class="text-neutral-300 hover:text-neutral-700 tap shrink-0">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
              </div>
              ${line.mods ? `<p class="text-xs text-neutral-400 mt-0.5 leading-tight">${line.mods}</p>` : ''}
              <div class="flex items-center justify-between mt-2">
                <div class="flex items-center gap-1.5">
                  <button data-dec="${line.id}" class="w-7 h-7 rounded-md border border-hairline-strong text-neutral-700 text-sm font-semibold tap hover:bg-neutral-50">−</button>
                  <span class="text-sm font-semibold w-6 text-center">${line.qty}</span>
                  <button data-inc="${line.id}" class="w-7 h-7 rounded-md border border-hairline-strong text-neutral-700 text-sm font-semibold tap hover:bg-neutral-50">+</button>
                </div>
                <span class="text-sm font-bold text-neutral-900">${fmt(line.unitPrice * line.qty)}</span>
              </div>
            </div>
          </div>
        `).join('');

                // Wire line buttons
                $$('[data-inc]').forEach(b => b.addEventListener('click', () => changeQty(parseFloat(b.dataset.inc), 1)));
                $$('[data-dec]').forEach(b => b.addEventListener('click', () => changeQty(parseFloat(b.dataset.dec), -1)));
                $$('[data-remove]').forEach(b => b.addEventListener('click', () => removeLine(parseFloat(b.dataset.remove))));
            }

            // Totals
            const subtotal = cart.reduce((s, l) => s + l.unitPrice * l.qty, 0);
            const tax = subtotal * TAX_RATE;
            const total = subtotal + tax;

            $('#subtotal').textContent = fmt(subtotal);
            $('#tax').textContent = fmt(tax);
            $('#total').textContent = fmt(total);
            $('#item-count').textContent = `${cart.reduce((s, l) => s + l.qty, 0)} item${cart.reduce((s, l) => s + l.qty, 0) === 1 ? '' : 's'}`;
            $('#pay-btn').disabled = cart.length === 0;
        }

        // Clear order
        $('#clear-order').addEventListener('click', () => {
            if (cart.length === 0) return;
            cart = [];
            renderCart();
        });

        // Pay button - just demo behavior
        $('#pay-btn').addEventListener('click', () => {
            if (cart.length === 0) return;
            const total = $('#total').textContent;
            $('#pay-btn').innerHTML = `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Paid ${total}`;
            $('#pay-btn').classList.add('opacity-70');
            setTimeout(() => {
                cart = [];
                renderCart();
                $('#pay-btn').innerHTML = `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg> Pay Now`;
                $('#pay-btn').classList.remove('opacity-70');
            }, 1400);
        });

        // Init
        renderProducts();
        renderCart();
    </script>
</body>

</html>
